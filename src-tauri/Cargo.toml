[package]
name = "mylead"
version = "0.1.0"
description = "MyLead — Lokális B2B lead kutatás, weboldal-audit és automatizált e-mail outreach alkalmazás"
authors = ["MyLead"]
edition = "2021"

[lib]
name = "mylead_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "deflate"] }
scraper = "0.22"
url = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
imap = "2"
native-tls = "0.2"
mail-parser = "0.9"
thiserror = "2"
